kind = "slides"
previewPath = "/pitch/"
title = "Grafly Pitch"
version = "1.0.0"
id = "artifacts/pitch"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pitch/" ]
localPort = 20938

[services.development]
run = "pnpm --filter @workspace/pitch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pitch", "run", "build" ]
publicDir = "artifacts/pitch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20938"
BASE_PATH = "/pitch/"
