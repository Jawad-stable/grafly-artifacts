kind = "slides"
previewPath = "/brand-guidelines/"
title = "Grafly Brand Guidelines"
version = "1.0.0"
id = "artifacts/brand-guidelines"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/brand-guidelines/" ]
localPort = 21719

[services.development]
run = "pnpm --filter @workspace/brand-guidelines run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/brand-guidelines", "run", "build" ]
publicDir = "artifacts/brand-guidelines/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21719"
BASE_PATH = "/brand-guidelines/"
