<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm it's you on Grafly</title>
  </head>
  <body style="margin:0; padding:0; background:#F5F6FA; font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; color:#21263F;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F5F6FA;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px; width:100%; background:#FFFFFF; border-radius:24px; overflow:hidden; box-shadow:0 12px 36px rgba(33,38,63,0.08);">
            <tr>
              <td style="background:linear-gradient(135deg, #21263F 0%, #00A4FA 100%); padding:36px 32px; text-align:center;">
                <div style="display:inline-block; padding:8px 14px; border-radius:100px; background:rgba(255,255,255,0.18); color:#FFFFFF; font-size:11px; font-weight:800; letter-spacing:1.6px;">SECURITY CHECK</div>
                <h1 style="margin:18px 0 0; color:#FFFFFF; font-size:32px; font-weight:800; letter-spacing:-0.8px; line-height:1.15;">Confirm it's really you</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:32px; text-align:center;">
                <p style="margin:0 0 16px; font-size:16px; line-height:1.55;">Use this code in the Grafly app to finish what you started:</p>
                <div style="margin:24px auto; padding:20px 28px; display:inline-block; background:#F5F6FA; border-radius:18px; border:1.5px dashed #00A4FA;">
                  <div style="font-size:36px; font-weight:800; letter-spacing:8px; color:#21263F; font-family:'Courier New',monospace;">{{ .Token }}</div>
                </div>
                <p style="margin:8px 0 0; font-size:13px; line-height:1.55; color:#6B7186;">This code expires in a few minutes.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 28px; border-top:1px solid #EEF0F6;">
                <p style="margin:0; font-size:12px; line-height:1.5; color:#6B7186;">If you didn't trigger this, change your password right away — someone else may have your credentials.</p>
              </td>
            </tr>
          </table>
          <p style="margin:20px 0 0; font-size:11px; color:#9AA0B4; letter-spacing:0.4px;">Grafly · Learn design, one lesson at a time</p>
        </td>
      </tr>
    </table>
  </body>
</html>
