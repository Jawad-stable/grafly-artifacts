kind = "mobile"
previewPath = "/"
title = "Grafly"
version = "1.0.0"
id = "artifacts/grafly"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 23788

[services.development]
run = "pnpm --filter @workspace/grafly run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/grafly", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/grafly", "run", "serve" ]

[services.env]
PORT = "23788"
BASE_PATH = "/"
